name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened, review_requested]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  # ============================================================================
  # CI STAGE - Builds and compiles the code
  # ============================================================================
  build:
    name: Build & Compile
    # Don't run build on review_requested as it's purely for notification
    if: github.event.action != 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

  # ============================================================================
  # NOTIFICATION STAGE - PR Alerts to Discord
  # ============================================================================
  notify:
    name: Discord PR Alert
    if: github.event.action == 'opened' || github.event.action == 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Send PR to Discord
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Lấy danh sách Reviewers
          REVIEWERS=$(jq -r '.pull_request.requested_reviewers[].login' <<< '${{ toJson(github.event) }}')

          if [ -z "$REVIEWERS" ] && [ "${{ github.event.action }}" == "review_requested" ]; then
            echo "No reviewers found. Skipping notification."
            exit 0
          fi

          declare -A MAP
          MAP["Hoang-Nguyen-Huy"]="<@620091987336626238>"
          MAP["HuyDiCode"]="<@650208747141988365>"
          MAP["nguyenhcp2004"]="<@761822942740086808>"
          MAP["ThanhTriIsCoding"]="<@868924065874858004>"
          MAP["toki-ai"]="<@897685284286791732>"

          TAGS=""
          for r in $REVIEWERS; do
            if [ "$r" != "$AUTHOR" ]; then
              TAGS="$TAGS ${MAP[$r]}"
            fi
          done

          if [ -z "$(echo $TAGS | xargs)" ] && [ "${{ github.event.action }}" == "review_requested" ]; then
            echo "No other human reviewers to tag. Skipping."
            exit 0
          fi

          TAGS=$(echo $TAGS | xargs)
          [ -z "$TAGS" ] && TAGS="None"

          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d "{
            \"content\": \"🚀 **New PR Notification**\n**TITLE:** $PR_TITLE\n**LINK:** $PR_URL\n👤 **Author:** $AUTHOR\n👀 **Reviewers:** $TAGS\"
          }"

  # ============================================================================
  # CD STAGE - Containerization and Deployment
  # ============================================================================
  containerize:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    # Only run on push to main or develop
    if:
      github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      environment: ${{ steps.vars.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          if [ "${BRANCH}" == "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

          echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/realvista-ai:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/realvista-ai:${{ steps.vars.outputs.branch }}-latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to SSH Server
    runs-on: ubuntu-latest
    needs: [containerize]
    environment: ${{ needs.containerize.outputs.environment }}
    if: always() && needs.containerize.result == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TAG: ${{ needs.containerize.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            echo "============================================"
            echo "  Deploying RealVista-AI"
            echo "  Image Tag: ${DEPLOY_TAG}"
            echo "============================================"

            # Login to Docker Hub
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            # Move to deployment directory
            cd ~/compose/ai-service

            # Update .env with new image tag
            if grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${DEPLOY_TAG}|" .env
            else
              echo "IMAGE_TAG=${DEPLOY_TAG}" >> .env
            fi

            # Deploy using Docker Compose
            docker compose pull
            docker compose up -d

            # Cleanup
            docker image prune -f
            docker logout

  # ============================================================================
  # SUMMARY STAGE - Pipeline Report
  # ============================================================================
  ci-cd-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [build, containerize, deploy]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "CI/CD Pipeline Summary"
          echo "======================"
          echo "Build Status       : ${{ needs.build.result }}"
          echo "Containerize Status: ${{ needs.containerize.result }}"
          echo "Deploy Status      : ${{ needs.deploy.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::CI Build failed"
            exit 1
          fi
