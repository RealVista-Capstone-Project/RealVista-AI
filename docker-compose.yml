services:
  # ── AI Microservice ──
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realvista-ai
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - realvista-ai-net

  # ── Redis (for persistent chat thread memory) ──
  redis:
    image: redis:7-alpine
    container_name: realvista-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - realvista-ai-net

  # ── Qdrant Vector Database (for RAG) ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: realvista-qdrant
    ports:
      - '6333:6333' # REST API
      - '6334:6334' # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:6333/readyz',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - realvista-ai-net

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  realvista-ai-net:
    driver: bridge
